<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A16" />

    <!-- ===== SEO ===== -->
    <title>Love meet — Find Your Person | Meet, Match, Chat &amp; Earn</title>
    <meta name="description" content="Love meet is where hearts meet. Find love, meet new people near you, match, chat in real time, send gifts, and earn money through gifting and a 5%-for-life affiliate program. Free to join — 18+." />
    <meta name="keywords" content="love, meet, love meet, lovemeet, dating, dating app, find love, meet singles, online dating, meet people, chat, match, relationships, send gifts, make money online, affiliate, earn money, dating site, find your person, meet near me" />
    <meta name="author" content="Love meet" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://lovemeetapp.com/" />
    <meta name="application-name" content="Love meet" />

    <!-- Open Graph (Facebook, LinkedIn, Telegram, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Love meet" />
    <meta property="og:title" content="Love meet — Find Your Person 💕" />
    <meta property="og:description" content="Meet, match and chat with people near you. Send gifts, build real connections, and earn through gifting + a 5%-for-life affiliate program. Free to join." />
    <meta property="og:url" content="https://lovemeetapp.com/" />
    <meta property="og:image" content="https://lovemeetapp.com/hero.jpeg" />
    <meta property="og:image:alt" content="Love meet — find your person" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Love meet — Find Your Person 💕" />
    <meta name="twitter:description" content="Meet, match and chat with people near you. Send gifts, make real connections, and earn with our affiliate program. Free to join." />
    <meta name="twitter:image" content="https://lovemeetapp.com/hero.jpeg" />

    <!-- Structured data: WebSite + Organization (rich results + sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://lovemeetapp.com/#org",
          "name": "Love meet",
          "url": "https://lovemeetapp.com/",
          "logo": "https://lovemeetapp.com/logo.png",
          "description": "A dating and social app to meet, match, chat and earn."
        },
        {
          "@type": "WebSite",
          "@id": "https://lovemeetapp.com/#website",
          "url": "https://lovemeetapp.com/",
          "name": "Love meet",
          "publisher": { "@id": "https://lovemeetapp.com/#org" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://lovemeetapp.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "name": "Love meet",
          "url": "https://lovemeetapp.com/",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "Web, iOS, Android, Telegram",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        }
      ]
    }
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
    <!-- Telegram WebApp SDK. No-op outside Telegram; provides window.Telegram.WebApp when launched from a bot. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Critical-CSS preloader. Inlined so it paints the instant the HTML
         arrives — before the JS/CSS bundle downloads — then React's first
         render replaces #root's contents and it's gone. Zero JS, no deps. -->
    <style>
      #lm-preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 720px at 84% -8%, rgba(255, 61, 142, 0.22), transparent 56%),
          radial-gradient(900px 760px at 4% 108%, rgba(155, 77, 255, 0.20), transparent 56%),
          #070a16;
      }
      #lm-preloader .ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: conic-gradient(
          from 90deg,
          rgba(255, 255, 255, 0.06),
          #ff3d8e,
          #9b4dff,
          rgba(255, 255, 255, 0.06)
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
                mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
        animation: lm-preload-spin 0.85s linear infinite;
      }
      @keyframes lm-preload-spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) {
        #lm-preloader .ring { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="lm-preloader"><div class="ring"></div></div>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
